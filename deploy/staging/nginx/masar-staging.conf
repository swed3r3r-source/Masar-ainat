# nginx للبيئة التجريبية — HTTPS إلزامي، والتطبيق خلفه لا بجانبه.
#
# التطبيق يستمع على 8080 داخل الشبكة الداخلية فقط. لا يوجد مسار يصل إليه
# من الإنترنت إلا عبر هذا الملف.

# رؤوس الطلب الكبيرة: مصفوفات OSRM تُرسل في مسار الرابط، وخطة وطنية
# غير مقسَّمة تتجاوز الافتراضي (٨ ك.ب). المزوّد يقسّم أصلًا، وهذا هامش أمان.
large_client_header_buffers 4 16k;

# حدّ محاولات الدخول عند الحافة أيضًا، لا في التطبيق وحده: هجوم تخمين
# يُستهلك موارد الخادم قبل أن يصل إلى منطق التطبيق.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

upstream masar_app {
    server app:8080;
    keepalive 16;
}

# ٨٠ للتحويل فقط — لا محتوى يُقدَّم بلا تشفير
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # مسار تحدّي Let's Encrypt يبقى على HTTP وهذا مقصود
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # TLS 1.2+ فقط. 1.0 و1.1 مهجورتان ولا يجوز قبولهما لبيانات صحية.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # لا يُعلن الخادم عن نفسه ولا عن إصداره
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "same-origin" always;
    # لا موارد خارجية إطلاقًا: الواجهة بلا إطار عمل وبلا CDN، فالسياسة
    # الضيقة لا تكسر شيئًا وتغلق باب حقن السكربتات.
    add_header Content-Security-Policy   "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    client_max_body_size 25m;      # مستندات إثبات التسليم
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://masar_app;
    }

    # مجرى الأحداث الحيّة: بلا تخزين مؤقت وبلا مهلة قصيرة، وإلا انقطع التتبع
    location /api/events {
        proxy_pass http://masar_app;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://masar_app;
        proxy_read_timeout 300s;    # تشغيل المحرك قد يطول
    }
}
