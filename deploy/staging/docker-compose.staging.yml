# بيئة «مسار عينات» التجريبية (staging) — كاملة ومعزولة.
#
#   ../../scripts/staging-up.sh        # التشغيل (لا تُشغّل compose يدويًا أول مرة)
#   ../../scripts/staging-test.sh      # التحقق بعد التشغيل
#
# ── قواعد الأمان المضمَّنة في هذا الملف ──────────────────────────────────
# ١) **لا منفذ مكشوف إلا 443 و80**. قاعدة البيانات وOSRM والتطبيق كلها على
#    شبكة داخلية بلا ربط منافذ إلى المضيف. المنفذ 8080 غير مكشوف إطلاقًا؛
#    الوصول عبر nginx وHTTPS حصرًا.
# ٢) **لا أسرار في هذا الملف**. كل قيمة حساسة تأتي من .env.staging الذي
#    يولّده staging-up.sh ولا يدخل المستودع.
# ٣) **إصدارات مثبَّتة بدقة** — لا `latest`. وسم متحرك يعني بيئة لا تُعاد
#    إنتاجها، وترقية صامتة لم يوافق عليها أحد.
# ٤) **فحص صحي لكل خدمة**، والاعتماديات مشروطة بـ`service_healthy` لا
#    بـ`service_started`: حاوية بدأت ليست حاوية جاهزة.

name: masar-staging

x-restart: &restart
  restart: unless-stopped

services:
  # ────────────────────────────────────────────────────────── قاعدة البيانات
  db:
    <<: *restart
    image: postgres:16.4-bookworm
    # لا ports: — غير مكشوفة للمضيف ولا للإنترنت. الوصول من الشبكة الداخلية
    # وحدها. للتشخيص: docker compose exec db psql -U "$POSTGRES_USER"
    networks: [internal]
    environment:
      POSTGRES_DB: ${MASAR_DB_NAME}
      POSTGRES_USER: ${MASAR_DB_MIGRATE_USER}
      POSTGRES_PASSWORD: ${MASAR_DB_MIGRATE_PASSWORD}
      # يقرؤهما initdb/01-app-role.sh لإنشاء دور التطبيق منفصلًا
      MASAR_DB_USER: ${MASAR_DB_USER}
      MASAR_DB_PASSWORD: ${MASAR_DB_PASSWORD}
      # C locale: ترتيب حتمي لا يتغيّر بتغيّر إعدادات المضيف
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /var/lib/masar/wal/%f && cp %p /var/lib/masar/wal/%f
      - -c
      - archive_timeout=300          # RPO ≤ ٥ دقائق
      - -c
      - max_connections=100
    volumes:
      - db-data:/var/lib/postgresql/data
      - wal-archive:/var/lib/masar/wal
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -q"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ──────────────────────────────────────────── تجهيز بيانات الطرق (مرة واحدة)
  # profile منفصل: خطوة ثقيلة (١٠–٢٥ دقيقة) لا تتكرر إلا عند تحديث الخريطة.
  osrm-prepare:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles: ["prepare"]
    networks: [internal]
    volumes:
      - osrm-data:/data
      - ../osrm/data:/source:ro
    entrypoint: ["/bin/bash", "-c"]
    command: >
      set -e;
      test -f /source/saudi-arabia-latest.osm.pbf ||
        { echo 'خريطة السعودية غير منزَّلة — شغّل deploy/osrm/fetch-map.sh'; exit 1; };
      cp /source/saudi-arabia-latest.osm.pbf /data/;
      osrm-extract   -p /opt/car.lua /data/saudi-arabia-latest.osm.pbf;
      osrm-partition /data/saudi-arabia-latest.osrm;
      osrm-customize /data/saudi-arabia-latest.osrm;
      rm -f /data/saudi-arabia-latest.osm.pbf;
      echo 'اكتمل تجهيز بيانات الطرق'

  # ──────────────────────────────────────────────────── خدمة الطرق الحقيقية
  osrm:
    <<: *restart
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    # لا ports: — osrm-routed **بلا مصادقة إطلاقًا**. كشفها للإنترنت يعني
    # خدمة حوسبة مجانية للجميع، وتسريب خريطة منشآتك عبر أنماط الاستعلام.
    networks: [internal]
    volumes:
      - osrm-data:/data:ro
    command: >
      osrm-routed --algorithm mld
      --max-table-size ${MASAR_OSRM_MAX_TABLE:-2000}
      --max-matching-size 100
      /data/saudi-arabia-latest.osrm
    healthcheck:
      # ليس «هل الخدمة ترد» بل «هل ترد بمسار داخل السعودية» — خدمة على
      # خريطة قارة أخرى ترد Ok بأرقام سليمة الشكل وعديمة القيمة.
      test: ["CMD-SHELL",
             "wget -qO- 'http://localhost:5000/route/v1/driving/41.04,30.98;43.498,29.6202?overview=false' | grep -q '\"code\":\"Ok\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ───────────────────────────────────────────────────────────── التطبيق
  app:
    <<: *restart
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile
    image: masar-ainat:staging
    # لا ports: — المنفذ 8080 غير مكشوف. nginx وحده يصل إليه داخليًا.
    networks: [internal]
    depends_on:
      db: { condition: service_healthy }
      osrm: { condition: service_healthy }
    environment:
      APP_ENV: staging
      MASAR_ENV: staging
      MASAR_DB_HOST: db
      MASAR_DB_PORT: "5432"
      MASAR_DB_NAME: ${MASAR_DB_NAME}
      MASAR_DB_USER: ${MASAR_DB_USER}
      MASAR_DB_PASSWORD: ${MASAR_DB_PASSWORD}
      MASAR_DB_MIGRATE_USER: ${MASAR_DB_MIGRATE_USER}
      MASAR_DB_MIGRATE_PASSWORD: ${MASAR_DB_MIGRATE_PASSWORD}
      MASAR_DB_SSLMODE: disable          # داخل شبكة معزولة لا تغادر المضيف
      MASAR_JWT_SECRET: ${MASAR_JWT_SECRET}
      MASAR_ENCRYPTION_KEYS: ${MASAR_ENCRYPTION_KEYS}
      MASAR_ENCRYPTION_ACTIVE_KEY: ${MASAR_ENCRYPTION_ACTIVE_KEY}
      # طرق حقيقية إلزامًا: haversine تقديري وينحرف +28٪ مسافةً و+64٪ زمنًا
      MASAR_ROUTING_PROVIDER: osrm
      MASAR_OSRM_URL: http://osrm:5000
      MASAR_OSRM_BLOCK_SIZE: ${MASAR_OSRM_BLOCK_SIZE:-100}
      # بيانات تجريبية موسومة مسموحة هنا، وممنوعة في الإنتاج بمحفّز قاعدة
      MASAR_ALLOW_TEST_DATA: "true"
      MASAR_SOLVE_WORKERS: ${MASAR_SOLVE_WORKERS:-2}
      MASAR_TZ: Asia/Riyadh
      MASAR_STORAGE_PATH: /var/lib/masar/storage
    volumes:
      - app-storage:/var/lib/masar
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # ─────────────────────────────────────────────────────── nginx + HTTPS
  nginx:
    <<: *restart
    image: nginx:1.27.4-alpine
    # المنافذ الوحيدة المكشوفة في المنظومة كلها.
    ports:
      - "${MASAR_HTTP_PORT:-80}:80"
      - "${MASAR_HTTPS_PORT:-443}:443"
    networks: [internal, public]
    depends_on:
      app: { condition: service_healthy }
    volumes:
      - ./nginx/masar-staging.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    healthcheck:
      # -k لأن شهادة البيئة التجريبية موقَّعة ذاتيًا افتراضيًا
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate https://localhost/api/health | grep -q '\"ok\":true' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  # الشبكة الداخلية بلا نفاذ خارجي: حتى لو أُسيء ضبط خدمة، لا تصل إلى
  # الإنترنت ولا يصل إليها منه.
  internal:
    internal: true
  public:

volumes:
  db-data:
  wal-archive:
  osrm-data:
  app-storage:
