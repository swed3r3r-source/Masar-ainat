# ============================================================================
# مسار عينات — عكس الوكيل وإنهاء TLS
#
# التطبيق يستمع على 127.0.0.1 فقط ولا يُعرَّض مباشرةً. هذه الطبقة مسؤولة عن:
# TLS، وحد حجم الرفع، وتمرير عنوان العميل الحقيقي (تُبنى عليه حدود المعدّل)،
# وتدفق الأحداث (SSE) الذي يحتاج إطفاء التخزين المؤقت.
# ============================================================================

# إعادة توجيه كل HTTP إلى HTTPS — لا استثناء
server {
    listen 80;
    listen [::]:80;
    server_name masar.example.sa;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name masar.example.sa;

    ssl_certificate     /etc/ssl/masar/fullchain.pem;
    ssl_certificate_key /etc/ssl/masar/privkey.pem;

    # TLS 1.2 فأعلى فقط؛ الإصدارات الأقدم بها ضعف معروف
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # حجم الرفع: يطابق MASAR_MAX_UPLOAD_BYTES كي يُرفض الكبير هنا لا بعد نقله
    client_max_body_size 25m;
    client_body_timeout 60s;

    # لا نعلن إصدار الخادم
    server_tokens off;

    access_log /var/log/nginx/masar.access.log;
    error_log  /var/log/nginx/masar.error.log warn;

    # ------------------------------------------------ تدفق الأحداث (SSE) ----
    # اتصال مفتوح طويل: التخزين المؤقت يحبس الأحداث ويجعل الشاشة تبدو معطّلة.
    location /api/events {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # الأصول الثابتة: تخزين مؤقت طويل آمن لأن أسماءها تحمل بصمة الإصدار
    location /static/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_cache_valid 200 1h;
        add_header Cache-Control "public, max-age=3600";
    }
}
